services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/local/bin/stockfish
    ports:
      - "10000:10000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/local/bin/stockfish
    depends_on:
      redis:
        condition: service_healthy
